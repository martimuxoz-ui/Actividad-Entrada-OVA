<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="t d">
  <title id="t">Balanza en equilibrio</title>
  <desc id="d">Una balanza con x más 2 en un platillo y 5 en el otro, representando la ecuación x + 2 = 5.</desc>
  <style>
    .viga { transform-origin: 200px 90px; animation: oscilar 5s ease-in-out infinite; }
    .platillo-izq { transform-origin: 60px 90px; animation: contra 5s ease-in-out infinite; }
    .platillo-der { transform-origin: 340px 90px; animation: contra 5s ease-in-out infinite; }
    @keyframes oscilar { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes contra  { 0%, 100% { transform: rotate(5deg); }  50% { transform: rotate(-5deg); } }
    text { font-family: Poppins, system-ui, sans-serif; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { .viga, .platillo-izq, .platillo-der { animation: none; } }
  </style>
  <!-- Soporte fijo -->
  <polygon points="200,95 168,262 232,262" fill="#E4ECF7"/>
  <rect x="136" y="260" width="128" height="14" rx="7" fill="#14213D"/>
  <!-- Viga y platillos -->
  <g class="viga">
    <rect x="46" y="85" width="308" height="10" rx="5" fill="#14213D"/>
    <circle cx="200" cy="90" r="10" fill="#FFC53D"/>
    <g class="platillo-izq">
      <line x1="60" y1="90" x2="14" y2="210" stroke="#14213D" stroke-width="2"/>
      <line x1="60" y1="90" x2="106" y2="210" stroke="#14213D" stroke-width="2"/>
      <path d="M8 210 H112 C112 238 8 238 8 210 Z" fill="#2B59C3"/>
      <rect x="20" y="164" width="46" height="46" rx="6" fill="#2B59C3" stroke="#14213D" stroke-width="2"/>
      <text x="43" y="196" font-size="26" text-anchor="middle" fill="#FFFFFF">x</text>
      <rect x="72" y="178" width="32" height="32" rx="6" fill="#FFC53D" stroke="#14213D" stroke-width="2"/>
      <text x="88" y="201" font-size="20" text-anchor="middle" fill="#14213D">2</text>
    </g>
    <g class="platillo-der">
      <line x1="340" y1="90" x2="294" y2="210" stroke="#14213D" stroke-width="2"/>
      <line x1="340" y1="90" x2="386" y2="210" stroke="#14213D" stroke-width="2"/>
      <path d="M288 210 H392 C392 238 288 238 288 210 Z" fill="#2B59C3"/>
      <rect x="312" y="170" width="56" height="40" rx="6" fill="#FFC53D" stroke="#14213D" stroke-width="2"/>
      <text x="340" y="199" font-size="24" text-anchor="middle" fill="#14213D">5</text>
    </g>
  </g>
  <text x="200" y="304" font-size="22" text-anchor="middle" fill="#14213D">x + 2 = 5</text>
</svg>
